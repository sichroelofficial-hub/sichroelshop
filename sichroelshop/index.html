<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SICHROEL SHOP – Auto Update Harga Excel</title>
    </head>

<body>
<div class="bg-animation"><div class="circle"></div></div>
<script>
// --- KONFIGURASI EXCEL ---
// Ganti link di bawah dengan link 'Publish to Web' (.csv) dari Google Sheets kamu
const SHEET_CSV_URL = 'LINK_GOOGLE_SHEET_CSV_KAMU_DISINI';

let db_products = [];

// Fungsi untuk mengambil data dari Excel
async function fetchExcelData() {
    try {
        const response = await fetch(SHEET_CSV_URL);
        const data = await response.text();
        const rows = data.split('\n').slice(1); // Hapus header

        db_products = rows.map(row => {
            const cols = row.split(',');
            return {
                category: cols[0]?.trim(),
                produk: cols[1]?.trim(),
                varian: cols[2]?.trim(),
                harga: parseInt(cols[3]?.trim()),
                hargacoret: parseInt(cols[4]?.trim())
            };
        });
        
        // Refresh tampilan awal (Default: Topup)
        populateFromExcel('topup');
    } catch (error) {
        console.error("Gagal mengambil data harga:", error);
    }
}

// Fungsi pengatur tampilan produk berdasarkan kategori dan ID produk
function populateFromExcel(category) {
    // Mencari semua grid produk yang ada di kategori tersebut
    const grids = document.querySelectorAll('.nominal-grid');
    
    grids.forEach(grid => {
        const productID = grid.id.split('-')[0]; // Misal: 'ml' dari 'ml-prod-grid'
        const filtered = db_products.filter(p => p.category === category && p.produk === productID);
        
        if (filtered.length > 0) {
            grid.innerHTML = "";
            filtered.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "nominal-item";
                
                const hargaTxt = "Rp " + item.harga.toLocaleString('id-ID');
                const coretTxt = "Rp " + item.hargacoret.toLocaleString('id-ID');
                
                div.onclick = function() { 
                    selectNominal(this, item.varian + ' – ' + hargaTxt); 
                };
                
                let badgeHtml = index < 4 ? `<div class="best-seller-badge">Best Seller</div>` : "";
                
                div.innerHTML = `
                    ${badgeHtml}
                    <span class="val">${item.varian}</span>
                    <span class="price-strike">${coretTxt}</span>
                    <span class="price">${hargaTxt}</span>
                `;
                grid.appendChild(div);
            });
        }
    });
}

// Override fungsi switchCategory bawaan
function switchCategory(cat, el) {
    // ... (Kode visual tab active tetap sama) ...
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.category-section').forEach(sec => sec.style.display = 'none');
    document.getElementById('category-' + cat).style.display = 'block';
    
    // Tarik data dari database Excel lokal
    populateFromExcel(cat);
}

// Jalankan saat web dibuka
window.onload = () => {
    fetchExcelData();
};

// ... Masukkan sisa fungsi asli (prepareOrder, sendWA, dll) ...
</script>
</body>
</html>
